name: Release Sideglance

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
          - name: Linux x64
            runner: ubuntu-22.04
          - name: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install dependencies
        run: npm ci
      - name: Generate application icons
        shell: bash
        run: npx tauri icon src-tauri/icons/icon.svg
      - name: Build and upload signed bundles to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ github.event.release.id }}
          tagName: ${{ github.event.release.tag_name }}
          releaseDraft: false
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true

  publish:
    name: Upload update manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Create and upload the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const tag = process.env.RELEASE_TAG;
          const body = execFileSync('gh', ['release', 'view', tag, '--json', 'body', '--jq', '.body'], { encoding: 'utf8' }).trim();
          const instructions = fs.readFileSync('.github/RELEASE_TEMPLATE.md', 'utf8').trim();
          if (!body.includes('## Installing on macOS')) {
            fs.writeFileSync('release-notes.md', [body, instructions].filter(Boolean).join('\n\n'));
            execFileSync('gh', ['release', 'edit', tag, '--notes-file', 'release-notes.md'], { stdio: 'inherit' });
          }
          NODE
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir updater-signatures
          RELEASE_TAG="$RELEASE_TAG" node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const tag = process.env.RELEASE_TAG;
          const release = JSON.parse(execFileSync('gh', ['release', 'view', tag, '--json', 'body,assets'], { encoding: 'utf8' }));
          const signatureDirectory = 'updater-signatures';
          const asset = (pattern, target) => {
            const matches = release.assets.filter(({ name }) => pattern.test(name));
            if (matches.length !== 1) throw new Error(`Expected one ${target} signature, found ${matches.length}`);
            const signature = fs.readFileSync(`${signatureDirectory}/${matches[0].name}`, 'utf8').trim();
            if (!signature) throw new Error(`Signature for ${target} is empty`);
            return {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${encodeURIComponent(matches[0].name.slice(0, -4))}`,
            };
          };
          const version = tag.replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) throw new Error(`Invalid tag: ${tag}`);
          fs.writeFileSync('latest.json', `${JSON.stringify({
            version,
            notes: release.body || '',
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': asset(/\.app\.tar\.gz\.sig$/, 'macOS arm64'),
              'linux-x86_64': asset(/\.AppImage\.sig$/, 'Linux x64'),
              'windows-x86_64': asset(/-setup\.exe\.sig$/, 'Windows x64'),
            },
          }, null, 2)}\n`);
          NODE
          gh release upload "$RELEASE_TAG" latest.json --clobber
