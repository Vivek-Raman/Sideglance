[package]
name = "sideglance"
version = "2.1.0"
description = "A desktop status board for coding agents"
license = "GPL-3.0-only"
authors = ["Sideglance contributors"]
edition = "2021"

[lib]
name = "sideglance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
notify = "8"
chrono = { version = "0.4", features = ["clock"] }
rmcp = { version = "3.5.1", features = ["transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tempfile = "3"
schemars = "1"
uuid = { version = "1", features = ["v4", "v5"] }
sha2 = "0.10"
toml_edit = "0.22"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.dev]
debug = 0
incremental = false
